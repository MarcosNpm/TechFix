<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ @titulo }} · TechFix Framework</title>
    <meta name="description" content="Módulo de reportes de stock desarrollado con Fat-Free Framework para el TP10.">
    <link rel="icon" href="{{ @assets }}/img/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="{{ @assets }}/css/estilos.css">
</head>
<body>
<a class="skip-link" href="#contenido">Saltar al contenido principal</a>

<header class="site-header">

                    <path d="M23.8 10.5a6.4 6.4 0 0 0-8.1 8.1L9 25.3v4.4h4.4l6.7-6.7a6.4 6.4 0 0 0 8.1-8.1l-3.4 3.4-3.1-3.1 2.1-4.7Z" fill="#00A8CC"/>

            </span>
        </a>

        <nav class="nav" aria-label="Navegación del módulo">
            <ul class="nav__list">
                <li><a class="nav__link" href="{{ @sitio_url }}">Sitio principal</a></li>
                <li><a class="nav__link" href="{{ @modulo_url }}/">Reporte de stock</a></li>
                <li><a class="nav__link" href="{{ @modulo_url }}/api/stock">API JSON</a></li>
