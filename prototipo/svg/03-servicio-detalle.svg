Diagnóstico previo sin cargo y presupuesto cerrado.</text><circle cx="198" cy="428" r="10" fill="#E6F7FB"/><path d="M 192.12 428.28 L 196.6 432.76 L 204.16 422.96" fill="none" stroke="#007A99" stroke-width="1.54" stroke-linecap="round" stroke-linejoin="round"/><text x="220" y="433" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" fill="#333333">Pantalla de repuesto con calibración de color y brillo.</text><circle cx="198" cy="468" r="10" fill="#E6F7FB"/><path d="M 192.12 468.28 L 196.6 472.76 L 204.16 462.96" fill="none" stroke="#007A99" stroke-width="1.54" stroke-linecap="round" stroke-linejoin="round"/><text x="220" y="473" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" fill="#333333">Prueba táctil, sensores, cámara frontal y altavoz.</text><circle cx="198" cy="508" r="10" fill="#E6F7FB"/><path d="M 192.12 508.28 L 196.6 512.76 L 204.16 502.96" fill="none" stroke="#007A99" stroke-width="1.54" stroke-linecap="round" stroke-linejoin="round"/><text x="220" y="513" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" fill="#333333">Limpieza interna y revisión de la batería.</text><circle cx="198" cy="548" r="10" fill="#E6F7FB"/><path d="M 192.12 548.28 L 196.6 552.76 L 204.16 542.96" fill="none" stroke="#007A99" stroke-width="1.54" stroke-linecap="round" stroke-linejoin="round"/><text x="220" y="553" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" fill="#333333">Garantía escrita de 90 días sobre el repuesto.</text><text x="182" y="610" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="10" fill="#667085">El precio final puede variar según el modelo y el estado del equipo. Siempre te avisamos antes de intervenir.</text><rect x="909" y="318" width="382" height="330" fill="#0F172A" rx="18" opacity="0.06" /><rect x="906" y="310" width="382" height="330" fill="#FFFFFF" rx="18" stroke="#E2E8F0" stroke-width="1" /><text x="936" y="350" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="11" fill="#66