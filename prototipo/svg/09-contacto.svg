re *</text><rect x="182" y="440" width="330" height="44" fill="#FFFFFF" rx="10" stroke="#E2E8F0" stroke-width="1" /><text x="196" y="467.0" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12" fill="#98A2B3">Ej.: Lucía Fernández</text><text x="532" y="430" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="11" fill="#1A1A2E" font-weight="700">Correo *</text><rect x="532" y="440" width="350" height="44" fill="#FFFFFF" rx="10" stroke="#E2E8F0" stroke-width="1" /><text x="546" y="467.0" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12" fill="#98A2B3">nombre@dominio.com</text><text x="182" y="520" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="11" fill="#1A1A2E" font-weight="700">Teléfono</text><rect x="182" y="530" width="330" height="44" fill="#FFFFFF" rx="10" stroke="#E2E8F0" stroke-width="1" /><text x="196" y="557.0" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12" fill="#98A2B3">+54 11 5555-0101</text><text x="532" y="530" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="11" fill="#1A1A2E" font-weight="700">Asunto *</text><rect x="532" y="540" width="350" height="44" fill="#FFFFFF" rx="10" stroke="#E2E8F0" stroke-width="1" /><text x="546" y="567" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12" fill="#333333">Consulta por una reparación</text><text x="182" y="604" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="11" fill="#1A1A2E" font-weight="700">Mensaje *</text><rect x="182" y="614" width="700" height="160" fill="#FFFFFF" rx="10" stroke="#E2E8F0" stroke-width="1" /><text x="196" y="640" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12" fill="#333333">Hola, tengo un problema con la batería de mi notebook. Se descarga muy rápido y a veces no carga.</text><text x="196" y="659" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12" fill="#333333">¿Pueden revisarla?</text><rect x="182" y="797" width="10" height="10" fill="#FFFFFF" rx="2" stroke="#B8C4D4" stroke-width="1" /><text x="200" y="806" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="10" fill="#667085">Acepto la política de privacidad *</text><rect x="182" y="840" width="180" height="46" fill="#00A8CC" rx="23.0" /><text x="272.0" y="867.55" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" fill="#FFFFFF" font-weight="700" text-anchor="middle">Enviar mensaje</text><text x="182" y="916" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="9" fill="#667085">Los campos con * son obligatorios. Nunca compartimos tus datos.</text><rect x="943" y="368" width="348" height="170" fill="#0F172A" rx="18" opacity="0.06" /><rect x="940" y="360" width="348" height="170" fill="#FFFFFF" rx="18" stroke="#E2E8F0" stroke-width="1" /><path d="M 977.0 387.1 C 968.64 387.1 967.76 399.64 977.0 406.9 C 986.24 399.64 985.36 387.1 977.0 387.1 Z" fill="none" stroke="#007A99" stroke-width="1.54" stroke-linecap="round" stroke-linejoin="round"/><circle cx="977.0" cy="394.8" r="2.6399999999999997" fill="#007A99"/><text x="998" y="404" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12" fill="#1A1A2E" font-weight="700">Visitanos</text><text x="966" y="434" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="11" fill="#333333">Av. Rivadavia 1234, CABA</text><text x="966" y="454" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="10" fill="#667085">Lun a Vie · 9 a 19 h · Sáb · 9 a 13 h</text><rect x="943" y="558" width="348" height="170" fill="#0F172A" rx="18" opacity="0.06" /><rect x="940" y="550" width="348" height="170" fill="#FFFFFF" rx="18" stroke="#E2E8F0" stroke-width="1" /><path d="M 969.08 577.76 L 973.48 577.76 L 975.24 583.48 L 972.16 586.12 C 974.36 591.4 979.64 594.04 983.16 594.92 L 985.36 591.4 L 986.68 592.72 L 986.24 596.68 C 978.76 596.68 967.32 585.24 967.32 579.96 Z" fill="none" stroke="#007A99" stroke-width="1.54" stroke-linecap="round" stroke-linejoin="round"/><text x="998" y="594" font-family="Inter, S